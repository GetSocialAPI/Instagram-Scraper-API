[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "getsocialapi"
version = "0.1.1"
description = "DEPRECATED — renamed to getsocialapi-instagram; compatibility shim for old imports"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GetSocialAPI" }]
requires-python = ">=3.9"
dependencies = ["getsocialapi-instagram>=0.1.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/GetSocialAPI/Instagram-Scraper-API"

[tool.setuptools.packages.find]
include = ["getsocialapi*"]
