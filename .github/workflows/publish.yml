name: publish

on:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m build legacy-getsocialapi
          twine check dist/* legacy-getsocialapi/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-main
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-legacy
          path: legacy-getsocialapi/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-main
          path: dist-main/
      - uses: actions/download-artifact@v4
        with:
          name: dist-legacy
          path: dist-legacy/
      - name: Publish getsocialapi-instagram to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-main/
      - name: Publish getsocialapi shim to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-legacy/
